# Doxygen runs purely as a C++ parser: XML output only, consumed by Breathe.
# The HTML/markdown renderer (and its bugs) is never used. Paths come from the
# environment so the same file serves the dev shell and the Nix derivation.

PROJECT_NAME           = "moba_sim"
PROJECT_NUMBER         = 0.1.0

INPUT                  = $(MOBA_SIM_ROOT)/src
FILE_PATTERNS          = *.hpp
RECURSIVE              = YES

# Everything public lands in the XML; Breathe directives pick what to render.
# The detail namespace is implementation, not API.
EXTRACT_ALL            = YES
EXTRACT_PRIVATE        = NO
EXCLUDE_SYMBOLS        = moba_sim::detail

# `///` comments are prose; the first sentence is the summary.
JAVADOC_AUTOBRIEF      = YES

PREDEFINED             = __cplusplus=202302L

GENERATE_HTML          = NO
GENERATE_LATEX         = NO
GENERATE_XML           = YES
XML_OUTPUT             = $(MOBA_SIM_DOXYGEN_XML)
XML_PROGRAMLISTING     = NO

# Undocumented public API is a warning by default and an error on demand
# (MOBA_SIM_DOCS_WARN_AS_ERROR=FAIL_ON_WARNINGS in CI), the same split the
# C++ warnings use.
WARNINGS               = YES
WARN_IF_UNDOCUMENTED   = YES
WARN_AS_ERROR          = $(MOBA_SIM_DOCS_WARN_AS_ERROR)

QUIET                  = YES
